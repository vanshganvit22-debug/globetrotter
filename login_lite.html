<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- Linear/Transactional page - navigation shell is suppressed as per rules -->
<main class="flex-grow flex w-full">
<div class="flex flex-col md:flex-row w-full h-screen">
<!-- Left Side: Image -->
<div class="hidden md:block w-full md:w-1/2 lg:w-7/12 h-full relative overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A breathtaking, wide-angle cinematic shot of a luxury stone villa in the rolling hills of Tuscany during golden hour. The warm sunlight casts long shadows across lush green vineyards and cypress trees. The mood is serene, aspirational, and deeply rooted in classic luxury travel. The aesthetic is editorial and high-end, utilizing natural earthy tones with a subtle warm vintage grade." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA8hh7BjrL5xu-mCVaOSY2cWqM0C_nYHI6ttqiF7MvOPkFX_oxjeNUvxll8OfGl-UDtYvGOfS_RDaknC25GLKYF0gbgKyDz6X6l1FTBRrmQp3bSUG2-5r8FR5n842QZvPg6ocO2CypSWrNOM1pGCaHjeTV_UwWaar-apHPx7BeqQW_pMLkrVaV_xZE54HVgPPw3mhAEC0O5FXC1e55e3Ok-9XaCQptUZ9p6k91lSGjdm_irWb3CmSy3bg')"></div>
<!-- Subtle gradient overlay for editorial feel -->
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full md:w-1/2 lg:w-5/12 h-full flex flex-col justify-center px-margin-mobile md:px-margin-desktop py-xl bg-background overflow-y-auto">
<div class="w-full max-w-md mx-auto flex flex-col">
<!-- Logo -->
<div class="mb-xl">
<span class="font-display-md text-headline-md tracking-tight text-on-surface">GlobeTrotter</span>
</div>
<!-- Headings -->
<div class="mb-lg">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue your journey.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md">
<!-- Email Input -->
<div class="relative flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-xs" for="email">Email Address</label>
<input class="bg-transparent border-0 border-b border-on-surface py-sm px-0 focus:ring-0 focus:border-primary-container font-body-md text-body-md text-on-surface transition-colors duration-200" id="email" name="email" placeholder="Enter your email" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="relative flex flex-col mt-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-xs" for="password">Password</label>
<input class="bg-transparent border-0 border-b border-on-surface py-sm px-0 focus:ring-0 focus:border-primary-container font-body-md text-body-md text-on-surface transition-colors duration-200" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-xs">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">Forgot Password?</a>
</div>
<!-- Sign In Button -->
<button class="mt-lg w-full bg-primary-container text-on-primary-container py-sm px-md rounded font-label-md text-label-md hover:opacity-90 transition-opacity duration-200 shadow-sm flex items-center justify-center gap-base" type="submit">
                            Sign In
                        </button>
</form>
<!-- Register Link -->
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                            Need an account? <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors duration-200 underline underline-offset-4 decoration-1" href="#">Register</a>
</p>
